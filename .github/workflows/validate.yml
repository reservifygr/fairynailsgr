name: Validate Fairynails demo
on:
  push:
    branches: [main, redesign/editorial-multipage-demo]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: node --check assets/site.js
      - name: Verify pages and booking/demo features
        run: node --test test/site.test.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/fairynails-server.log 2>&1 &
      - name: Test desktop, mobile, booking and staff demo
        run: node test/browser-e2e.mjs
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairynails-visual-checks
          path: artifacts/
          if-no-files-found: ignore
